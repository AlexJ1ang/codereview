[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codereview"
version = "0.2.0"
description = "Detect unnecessary implementation complexity in AI-generated code changes."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "AlexJ1ang", email = "jiangkehan0630@gmail.com"},
]
license = {text = "MIT"}
dependencies = [
    "typer>=0.9",
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
codereview = "codereview.cli:main"

[tool.setuptools.packages.find]
include = ["codereview*"]

[tool.pytest.ini_options]
testpaths = ["tests"]